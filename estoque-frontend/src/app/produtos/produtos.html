<div class="container">
  <h2>Cadastro de Produtos / Reposição de Estoque</h2>

  <div class="form-cadastro">
    <input #codigoInput type="text" [(ngModel)]="novoProduto.codigo" placeholder="Código (ex: 001)">
    <input #descricaoInput type="text" [(ngModel)]="novoProduto.descricao" placeholder="Descrição (ex: Notebook)">
    <input #saldoInput type="number" [(ngModel)]="novoProduto.saldo" placeholder="Quantidade / Saldo">
    <button (click)="adicionarProduto(codigoInput.value, descricaoInput.value, saldoInput.value)">Salvar / Repor Saldo</button>
  </div>

  <hr style="margin: 20px 0;">

  <h2>Lista de Produtos</h2>

  <table>
    <thead>
      <tr>
        <th>Código</th>
        <th>Descrição</th>
        <th>Saldo</th>
      </tr>
    </thead>
    <tbody>
      @for (prod of produtos; track prod.codigo) {
        <tr>
          <td>{{ prod.codigo }}</td>
          <td>{{ prod.descricao }}</td>
          <td>{{ prod.saldo }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
